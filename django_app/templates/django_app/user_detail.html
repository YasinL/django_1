<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户详情</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .detail-item { margin-bottom: 15px; }
        .detail-item label { font-weight: bold; display: inline-block; width: 100px; }
        .btn { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        a { text-decoration: none; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; color: #007bff; }
        .status-active { color: #28a745; }
        .status-inactive { color: #dc3545; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="{% url 'django_app:index' %}">首页</a>
        <a href="{% url 'django_app:user_list' %}">用户管理</a>
        <a href="{% url 'django_app:menu_list' %}">菜单管理</a>
    </div>
    
    <h1>用户详情</h1>
    
    <div class="detail-item">
        <label>ID:</label>
        <span>{{ user.id }}</span>
    </div>
    <div class="detail-item">
        <label>用户名:</label>
        <span>{{ user.username }}</span>
    </div>
    <div class="detail-item">
        <label>真实姓名:</label>
        <span>{{ user.real_name }}</span>
    </div>
    <div class="detail-item">
        <label>邮箱:</label>
        <span>{{ user.email }}</span>
    </div>
    <div class="detail-item">
        <label>手机号:</label>
        <span>{{ user.phone }}</span>
    </div>
    <div class="detail-item">
        <label>状态:</label>
        {% if user.status == 1 %}
            <span class="status-active">启用</span>
        {% else %}
            <span class="status-inactive">禁用</span>
        {% endif %}
    </div>
    <div class="detail-item">
        <label>创建时间:</label>
        <span>{{ user.created_at|date:"Y-m-d H:i:s" }}</span>
    </div>
    <div class="detail-item">
        <label>更新时间:</label>
        <span>{{ user.updated_at|date:"Y-m-d H:i:s" }}</span>
    </div>
    
    <div style="margin-top: 20px;">
        <a href="{% url 'django_app:user_update' user.id %}" class="btn btn-primary">编辑</a>
        <a href="{% url 'django_app:user_list' %}" class="btn btn-secondary">返回列表</a>
    </div>
</body>
</html>
